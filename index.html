<!DOCTYPE html>
<html lang="es" data-tema="oscuro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070c16">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f766e'/%3E%3Ccircle cx='16' cy='16' r='9' fill='white'/%3E%3Cpath d='M16 11l4 3-1.5 4.5h-5L12 14z' fill='%230b3f46'/%3E%3C/svg%3E">
  <title>Data Fútbol Colombia</title>
  <style>
/* Data Fútbol Colombia — diseño "arena nocturna": oscuro elegante, verde neón, azul eléctrico y dorado.
   Solo CSS puro, sin librerías ni fuentes externas (funciona sin internet). */
:root{
  color-scheme:dark;
  --fondo:#070c16; --fondo-sol:#070c16;
  --panel:rgba(18,27,46,.62); --panel-sol:#101a2e; --panel-2:rgba(255,255,255,.045);
  --texto:#f1f5fb; --suave:#a9b7cf;
  --borde:rgba(255,255,255,.09); --borde-fuerte:rgba(255,255,255,.28); --foco:#ffd166;
  --primario:#35f0a0; --sobre-primario:#03140c; --primario-fondo:rgba(53,240,160,.10);
  --azul:#4c8dff; --azul-fondo:rgba(76,141,255,.14);
  --acento:#ffc84a; --sobre-acento:#1a1100; --acento-txt:#ffd66e; --acento-fondo:rgba(255,200,74,.12);
  --ok:#3ee08f; --mal:#ff6b7a; --aviso:#ffc857;
  --zebra:rgba(255,255,255,.025); --pista:rgba(255,255,255,.10);
  --sombra:0 1px 0 rgba(255,255,255,.06) inset,0 14px 40px rgba(0,0,0,.45);
  --sombra-alta:0 1px 0 rgba(255,255,255,.10) inset,0 22px 50px rgba(0,0,0,.55),0 0 0 1px rgba(53,240,160,.25);
  --hero-a:#1d4ed8; --hero-b:#0a1330; --sobre-chip:#04140c;
  --brillo-a:rgba(53,240,160,.16); --brillo-b:rgba(76,141,255,.20); --brillo-c:rgba(255,200,74,.08);
  --curva:cubic-bezier(.2,.8,.2,1);
}
:root[data-tema="claro"]{
  color-scheme:light;
  --fondo:#eef3f9; --fondo-sol:#eef3f9;
  --panel:rgba(255,255,255,.78); --panel-sol:#ffffff; --panel-2:rgba(15,30,60,.04);
  --texto:#0c1730; --suave:#475671;
  --borde:rgba(15,30,60,.12); --borde-fuerte:rgba(15,30,60,.45); --foco:#1d4ed8;
  --primario:#007a4d; --sobre-primario:#ffffff; --primario-fondo:rgba(0,122,77,.10);
  --azul:#1d4ed8; --azul-fondo:rgba(29,78,216,.10);
  --acento:#b86e00; --sobre-acento:#ffffff; --acento-txt:#8f5400; --acento-fondo:rgba(184,110,0,.12);
  --ok:#067647; --mal:#b42318; --aviso:#9a5b00;
  --zebra:rgba(15,30,60,.03); --pista:rgba(15,30,60,.10);
  --sombra:0 1px 0 rgba(255,255,255,.9) inset,0 10px 30px rgba(15,30,60,.10);
  --sombra-alta:0 18px 44px rgba(15,30,60,.18),0 0 0 1px rgba(0,122,77,.35);
  --hero-a:#1d4ed8; --hero-b:#0b1b52; --sobre-chip:#ffffff;
  --brillo-a:rgba(0,122,77,.12); --brillo-b:rgba(29,78,216,.12); --brillo-c:rgba(184,110,0,.06);
}
*{box-sizing:border-box}
html{font-size:112.5%;scroll-behavior:smooth}
body{margin:0;color:var(--texto);line-height:1.6;min-height:100vh;
  font-family:"Segoe UI Variable Display","Segoe UI","SF Pro Display",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  background:
    radial-gradient(46rem 30rem at 4% -8%,var(--brillo-a),transparent 62%),
    radial-gradient(52rem 34rem at 100% 0%,var(--brillo-b),transparent 60%),
    radial-gradient(40rem 26rem at 70% 110%,var(--brillo-c),transparent 60%),
    var(--fondo);
  background-attachment:fixed;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{line-height:1.15;margin:0;letter-spacing:-.02em}
h2{font-size:clamp(1.6rem,1.2rem + 1.6vw,2.3rem);font-weight:800}
h3{font-size:1.08rem;font-weight:700}
h4{font-size:.78rem;margin:1.3rem 0 .6rem;color:var(--primario);font-weight:800;text-transform:uppercase;letter-spacing:.12em}
::selection{background:var(--primario);color:var(--sobre-primario)}
:focus-visible{outline:3px solid var(--foco);outline-offset:3px;border-radius:10px}
.ico{width:1.25em;height:1.25em;fill:currentColor;flex:none}
.salto{position:absolute;left:-999px;background:var(--primario);color:var(--sobre-primario);padding:1rem;z-index:50;border-radius:12px;font-weight:700}
.salto:focus{left:.5rem;top:.5rem}
.solo-lectores{position:absolute;left:-9999px}
.muted{color:var(--suave)}
strong{font-weight:700}

/* ---------- Estructura ---------- */
.app{display:grid;grid-template-columns:16.5rem minmax(0,1fr);grid-template-areas:"top top" "menu body";min-height:100vh}
.topbar{grid-area:top;position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:1rem;
  padding:.7rem 1.6rem;border-bottom:1px solid var(--borde);
  background:linear-gradient(180deg,color-mix(in srgb,var(--panel-sol) 88%,transparent),color-mix(in srgb,var(--panel-sol) 62%,transparent));
  -webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5)}
.topbar::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;
  background:linear-gradient(90deg,transparent,var(--primario),var(--azul),var(--acento),transparent);opacity:.7}
.marca{display:flex;align-items:center;gap:.85rem}
.marca>.ico{width:2.9rem;height:2.9rem;padding:.55rem;border-radius:16px;color:var(--sobre-primario);
  background:linear-gradient(135deg,var(--primario),#16c47f);box-shadow:0 0 0 1px rgba(255,255,255,.2) inset,0 8px 24px rgba(53,240,160,.35);
  animation:flota 5s ease-in-out infinite}
.marca h1{font-size:1.3rem;font-weight:900;letter-spacing:.16em;
  background:linear-gradient(90deg,var(--texto),var(--primario));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin:0;font-size:.78rem;color:var(--suave);letter-spacing:.02em}
.menu{grid-area:menu;position:sticky;top:5.4rem;align-self:start;margin:1.1rem 0 1.1rem 1.1rem;padding:.7rem;
  background:var(--panel);border:1px solid var(--borde);border-radius:26px;box-shadow:var(--sombra);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.cuerpo{grid-area:body;padding:1.6rem 1.6rem 2.2rem;min-width:0}

/* ---------- Botones ---------- */
button,select{font:inherit;min-height:52px;min-width:52px;border:1px solid var(--borde-fuerte);border-radius:999px;
  background:var(--panel-2);color:var(--texto);padding:.4rem 1.2rem;cursor:pointer;
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
button{display:inline-flex;align-items:center;justify-content:center;gap:.55rem;font-weight:700;position:relative;overflow:hidden;
  transition:transform .25s var(--curva),box-shadow .25s var(--curva),background .25s,border-color .25s,color .25s}
button::before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.28) 50%,transparent 70%);
  transform:translateX(-120%);transition:transform .6s var(--curva);pointer-events:none}
button:hover::before{transform:translateX(120%)}
button:hover{transform:translateY(-2px);border-color:var(--primario);color:var(--primario);box-shadow:0 10px 26px rgba(53,240,160,.18)}
button:active{transform:translateY(0) scale(.97)}
select{cursor:pointer;max-width:100%;font-weight:600;appearance:none;-webkit-appearance:none;padding-right:2.6rem;
  background-image:linear-gradient(45deg,transparent 50%,var(--primario) 50%),linear-gradient(135deg,var(--primario) 50%,transparent 50%);
  background-position:calc(100% - 1.35rem) 52%,calc(100% - 1rem) 52%;background-size:.4rem .4rem;background-repeat:no-repeat;
  transition:border-color .25s,box-shadow .25s}
select:hover{border-color:var(--primario);box-shadow:0 0 0 4px var(--primario-fondo)}
select option{background:var(--panel-sol);color:var(--texto)}
button.primario{background:linear-gradient(135deg,var(--primario),#16c47f);border-color:transparent;color:var(--sobre-primario);
  box-shadow:0 8px 24px rgba(53,240,160,.30)}
button.primario:hover{color:var(--sobre-primario);box-shadow:0 14px 34px rgba(53,240,160,.45)}
#tema .i-sol,#tema .tx-sol,:root[data-tema="oscuro"] #tema .i-luna,:root[data-tema="oscuro"] #tema .tx-luna{display:none}
:root[data-tema="oscuro"] #tema .i-sol{display:block}
:root[data-tema="oscuro"] #tema .tx-sol{display:inline}
#tema:hover .ico{animation:gira-suave .6s var(--curva)}
.menu button{width:100%;justify-content:flex-start;gap:.9rem;margin-bottom:.3rem;border-color:transparent;background:transparent;
  color:var(--suave);text-align:left;padding:.4rem 1.1rem;-webkit-backdrop-filter:none;backdrop-filter:none}
.menu button:last-child{margin-bottom:0}
.menu button .ico{width:1.5rem;height:1.5rem;transition:transform .3s var(--curva)}
.menu button:hover{background:var(--primario-fondo);border-color:transparent;color:var(--texto);transform:translateX(4px);box-shadow:none}
.menu button:hover .ico{transform:scale(1.15);color:var(--primario)}
.menu button[aria-current="page"]{color:var(--texto);border-color:color-mix(in srgb,var(--primario) 55%,transparent);
  background:linear-gradient(90deg,color-mix(in srgb,var(--primario) 24%,transparent),color-mix(in srgb,var(--primario) 6%,transparent));
  box-shadow:0 0 28px rgba(53,240,160,.15)}
.menu button[aria-current="page"] .ico{color:var(--primario)}
.menu button[aria-current="page"]::after{content:"";position:absolute;left:0;top:22%;bottom:22%;width:4px;border-radius:4px;
  background:var(--primario);box-shadow:0 0 12px var(--primario)}
.t-cr{display:none}
.filtro{display:flex;flex-wrap:wrap;gap:.7rem;align-items:center;margin-bottom:1.4rem;padding:.7rem .9rem;border:1px solid var(--borde);
  border-radius:22px;background:var(--panel);color:var(--primario);box-shadow:var(--sombra);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.filtro label{font-weight:700;color:var(--texto)}

/* ---------- Títulos y tarjetas ---------- */
.tit{display:flex;gap:1rem;align-items:center;margin-bottom:1.4rem}
.tit-ico,.chip-ico{display:grid;place-items:center;flex:none}
.tit-ico{width:3.4rem;height:3.4rem;border-radius:18px;color:var(--sobre-primario);
  background:linear-gradient(135deg,var(--primario),#16c47f);box-shadow:0 10px 28px rgba(53,240,160,.30)}
.tit-ico .ico{width:1.8rem;height:1.8rem}
.sub-h{margin:.2rem 0 0;color:var(--suave);font-size:.92rem}
.tarjeta{position:relative;background:var(--panel);border:1px solid var(--borde);border-radius:26px;padding:1.5rem;min-width:0;
  box-shadow:var(--sombra);-webkit-backdrop-filter:blur(16px) saturate(1.3);backdrop-filter:blur(16px) saturate(1.3);
  transition:transform .35s var(--curva),box-shadow .35s var(--curva),border-color .35s}
.tarjeta::before{content:"";position:absolute;left:1.5rem;right:1.5rem;top:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);opacity:.7;pointer-events:none}
.tarjeta:hover{transform:translateY(-5px);box-shadow:var(--sombra-alta)}
.tarjeta.verde{background:linear-gradient(160deg,var(--primario-fondo),var(--panel) 60%);border-color:color-mix(in srgb,var(--primario) 28%,var(--borde))}
.tarjeta.hero{color:#fff;border-color:rgba(255,255,255,.18);overflow:hidden;
  background:radial-gradient(22rem 14rem at 100% 0%,rgba(53,240,160,.35),transparent 60%),linear-gradient(135deg,var(--hero-a),var(--hero-b))}
.tarjeta.hero::after{content:"";position:absolute;right:-4rem;bottom:-5rem;width:15rem;height:15rem;border-radius:50%;
  border:2px solid rgba(255,255,255,.12);box-shadow:0 0 0 2.2rem rgba(255,255,255,.04),0 0 0 4.4rem rgba(255,255,255,.025);pointer-events:none}
.tarjeta.hero .muted,.hero .datos span{color:#dbe7ff}
.card-h{display:flex;align-items:center;gap:.75rem;margin-bottom:1.1rem}
.chip-ico{width:2.6rem;height:2.6rem;border-radius:14px;background:var(--acento-fondo);color:var(--acento-txt);transition:transform .35s var(--curva)}
.tarjeta:hover .chip-ico{transform:rotate(-8deg) scale(1.08)}
.verde .chip-ico{background:var(--primario-fondo);color:var(--primario)}
.hero .chip-ico{background:rgba(255,255,255,.18);color:#fff}
.puesto{margin-left:auto;font-size:1.9rem;font-weight:900;color:var(--acento-txt);font-variant-numeric:tabular-nums;
  text-shadow:0 0 22px color-mix(in srgb,var(--acento) 45%,transparent)}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(13rem,1fr));gap:1rem;margin-bottom:1.4rem}
.kpi{position:relative;overflow:hidden;display:flex;gap:1rem;align-items:center;background:var(--panel);border:1px solid var(--borde);
  border-radius:22px;padding:1.05rem 1.3rem;box-shadow:var(--sombra);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  transition:transform .35s var(--curva),box-shadow .35s var(--curva)}
.kpi::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--primario),var(--azul),var(--acento));opacity:.8}
.kpi:hover{transform:translateY(-4px) scale(1.01);box-shadow:var(--sombra-alta)}
.kpi .chip-ico{width:3.1rem;height:3.1rem;border-radius:16px;background:var(--primario-fondo);color:var(--primario)}
.kpi strong{display:block;font-size:2.2rem;line-height:1.05;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.kpi>div>span{color:var(--suave);font-size:.85rem}

.panel-grid{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:1.3rem;width:100%;
  grid-template-areas:"prox prox" "stats semana" "liga rend" "alertas verif"}
.g-prox{grid-area:prox}
.g-stats{grid-area:stats}.g-liga{grid-area:liga}.g-semana{grid-area:semana}
.g-rend{grid-area:rend}.g-alertas{grid-area:alertas}.g-verif{grid-area:verif}
.rejilla{display:grid;grid-template-columns:repeat(auto-fit,minmax(19rem,1fr));gap:1.3rem}
.apilado>*+*{margin-top:1.3rem}

/* ---------- Contenido ---------- */
.grande{font-size:1.65rem;font-weight:900;margin:0;letter-spacing:-.025em}
.jug{display:flex;flex-wrap:wrap;gap:1.3rem;align-items:center;position:relative;z-index:1}
.jug p{margin:.15rem 0}
.datos{display:flex;flex-wrap:wrap;gap:.65rem;margin-top:.8rem}
.datos div{text-align:center;border-radius:16px;padding:.5rem 1rem;background:var(--panel-2);border:1px solid var(--borde);
  transition:transform .3s var(--curva),background .3s}
.datos div:hover{transform:translateY(-3px);background:var(--primario-fondo)}
.hero .datos div{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.22)}
.datos strong{display:block;font-size:1.5rem;line-height:1.15;font-weight:900;font-variant-numeric:tabular-nums}
.datos span{font-size:.76rem;color:var(--suave);text-transform:uppercase;letter-spacing:.06em}
.foto{width:7.2rem;height:7.2rem;border-radius:24px;display:block;box-shadow:0 12px 30px rgba(0,0,0,.35);transition:transform .4s var(--curva)}
.hero:hover .foto{transform:rotate(-3deg) scale(1.05)}
.foto-fondo{fill:var(--primario-fondo)} .foto-fig{fill:var(--primario)}
.hero .foto-fondo{fill:rgba(255,255,255,.18)} .hero .foto-fig{fill:#fff}

.partidos,.alertas,.lista{list-style:none;margin:0;padding:0}
.partidos li,.lista li{padding:.75rem .5rem;margin:0 -.5rem;border-bottom:1px solid var(--borde);border-radius:14px;
  transition:background .25s,transform .25s var(--curva)}
.partidos li:hover,.lista li:hover{background:var(--panel-2);transform:translateX(4px)}
.partidos li:last-child,.lista li:last-child{border-bottom:0}
.vs{display:flex;flex-wrap:wrap;gap:.55rem;align-items:center}
.vs span{color:var(--suave);font-size:.75rem;font-weight:800;text-transform:uppercase;letter-spacing:.1em;padding:.05rem .5rem;
  border:1px solid var(--borde);border-radius:999px}
.vs strong{font-variant-numeric:tabular-nums}
.fecha{display:flex;gap:.4rem;align-items:center;color:var(--suave);font-size:.85rem;margin-top:.2rem}
.fecha .ico{color:var(--primario)}
.alerta{display:flex;gap:1rem;align-items:center;padding:.85rem 1.05rem;border-radius:18px;margin-bottom:.65rem;
  border:1px solid color-mix(in srgb,currentColor 55%,transparent);background:color-mix(in srgb,currentColor 11%,transparent);
  transition:transform .3s var(--curva),box-shadow .3s var(--curva)}
.alerta:hover{transform:translateX(5px);box-shadow:0 8px 26px color-mix(in srgb,currentColor 22%,transparent)}
.alerta:last-child{margin-bottom:0}
.alerta>div{color:var(--texto)}
.alerta>div span{display:block;color:var(--suave);font-size:.88rem}
.alerta-ico{display:grid;place-items:center;width:2.7rem;height:2.7rem;border-radius:50%;background:currentColor;flex:none;
  box-shadow:0 0 0 5px color-mix(in srgb,currentColor 18%,transparent)}
.alerta-ico .ico{color:var(--sobre-chip)}
.nota{display:flex;gap:.75rem;align-items:flex-start;margin:0;padding:.9rem 1.1rem;border-radius:18px;
  background:var(--azul-fondo);border:1px solid color-mix(in srgb,var(--azul) 35%,transparent)}
.nota .ico{color:var(--azul);margin-top:.2rem}
:root[data-tema="oscuro"] .nota .ico{color:#7db0ff}

.etq{display:inline-flex;align-items:center;gap:.4rem;padding:.18rem .8rem;border:1px solid color-mix(in srgb,currentColor 60%,transparent);
  border-radius:999px;font-weight:700;font-size:.82rem;background:color-mix(in srgb,currentColor 13%,transparent);
  transition:transform .25s var(--curva),box-shadow .25s}
.etq:hover{transform:translateY(-2px);box-shadow:0 6px 18px color-mix(in srgb,currentColor 25%,transparent)}
.ok{color:var(--ok)} .mal{color:var(--mal)} .aviso{color:var(--aviso)} .info{color:#7db0ff}
:root[data-tema="claro"] .info{color:var(--azul)}
.forma,.leyenda{display:flex;flex-wrap:wrap;gap:.45rem}
.leg{display:inline-block;width:.85rem;height:.85rem;background:var(--acento);border:2px solid var(--texto);border-radius:50%}
.leg-asi{border-radius:3px;background:transparent;border-color:var(--primario)}

/* ---------- Tablas ---------- */
.scroll{overflow-x:auto;border-radius:18px;border:1px solid var(--borde)}
table{border-collapse:collapse;width:100%;min-width:32rem}
table.compacta{min-width:0}
caption{text-align:left;font-weight:700;padding:.2rem .2rem .7rem}
th,td{padding:.7rem .75rem;text-align:center;border-bottom:1px solid var(--borde);font-variant-numeric:tabular-nums}
th:nth-child(2),td:nth-child(2){text-align:left}
th{background:var(--primario-fondo);color:var(--primario);font-size:.74rem;font-weight:800;text-transform:uppercase;letter-spacing:.09em;white-space:nowrap}
tbody tr{transition:background .2s,box-shadow .2s}
tbody tr:nth-child(even){background:var(--zebra)}
tbody tr:hover{background:color-mix(in srgb,var(--primario) 12%,transparent);box-shadow:inset 3px 0 0 var(--primario)}
tbody tr:last-child td{border-bottom:0}
tr.lider td{background:var(--acento-fondo);font-weight:700}
tr.lider td:first-child{box-shadow:inset 4px 0 0 var(--acento)}
tr.lider .ico{color:var(--acento-txt);filter:drop-shadow(0 0 6px var(--acento))}

/* ---------- Gráficos ---------- */
.barras{margin:.3rem 0}
.bar-fila{display:grid;grid-template-columns:minmax(6rem,11rem) 1fr 2.4rem;gap:.8rem;align-items:center;margin:.7rem 0}
.bar-fila>span{font-size:.88rem}
.bar-fila>strong{font-variant-numeric:tabular-nums;font-weight:800;text-align:right}
.pista{height:.95rem;border:0;border-radius:999px;background:var(--pista);overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.3)}
.pista i{display:block;height:100%;border-radius:999px;transform-origin:left center;
  background:linear-gradient(90deg,var(--primario),var(--azul));box-shadow:0 0 14px color-mix(in srgb,var(--primario) 55%,transparent)}
.grafico{width:100%;height:auto;max-height:20rem;display:block}
.grafico text{fill:var(--suave);font-size:13px;font-family:inherit}
.g-rej{stroke:var(--borde-fuerte);stroke-width:1;fill:none;opacity:.35}
.l-gol{fill:none;stroke:var(--acento);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 6px color-mix(in srgb,var(--acento) 60%,transparent))}
.l-asi{fill:none;stroke:var(--primario);stroke-width:4;stroke-dasharray:10 6;stroke-linecap:round;filter:drop-shadow(0 0 6px color-mix(in srgb,var(--primario) 60%,transparent))}
.m-gol{fill:var(--acento);stroke:var(--panel-sol);stroke-width:3}
.m-asi{fill:var(--panel-sol);stroke:var(--primario);stroke-width:3}
.r-area{fill:var(--primario);fill-opacity:.28;stroke:var(--primario);stroke-width:3;stroke-linejoin:round;

.radar{max-height:14rem}

/* ---------- Estado de los datos ---------- */

.tabla-pron td strong{color:var(--primario)}

/* ---------- Animaciones ---------- */
@keyframes sube{from{opacity:0;transform:translateY(22px) scale(.985)}to{opacity:1;transform:none}}
@keyframes aparece{from{opacity:0}to{opacity:1}}
@keyframes crece{from{transform:scaleX(0)}to{transform:scaleX(1)}}

  #contenido .kpis>*:nth-child(1),#contenido .panel-grid>*:nth-child(1),#contenido .rejilla>*:nth-child(1),#contenido .apilado>*:nth-child(1){animation-delay:.05s}
  #contenido .kpis>*:nth-child(2),#contenido .panel-grid>*:nth-child(2),#contenido .rejilla>*:nth-child(2),#contenido .apilado>*:nth-child(2){animation-delay:.12s}
  #contenido .kpis>*:nth-child(3),#contenido .panel-grid>*:nth-child(3),#contenido .rejilla>*:nth-child(3),#contenido .apilado>*:nth-child(3){animation-delay:.19s}
  #contenido .panel-grid>*:nth-child(4),#contenido .rejilla>*:nth-child(4),#contenido .apilado>*:nth-child(4){animation-delay:.26s}
  #contenido .panel-grid>*:nth-child(5),#contenido .rejilla>*:nth-child(5){animation-delay:.33s}
  #contenido .panel-grid>*:nth-child(n+6),#contenido .rejilla>*:nth-child(n+6){animation-delay:.4s}
  .pista i{animation:crece 1.1s var(--curva) .35s both}

/* ---------- Panel: Matchweek + Ranking TOP ---------- */

  box-shadow:var(--sombra-alta),0 0 0 1px color-mix(in srgb,var(--primario) 35%,transparent),0 0 28px color-mix(in srgb,var(--azul) 30%,transparent)}
.mw{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(17.5rem,1fr));gap:1rem}
.mw-card{display:flex;gap:.9rem;padding:.95rem;border-radius:16px;background:var(--panel-2);border:1px solid var(--borde);
  transition:transform .35s var(--curva),box-shadow .35s var(--curva),border-color .35s}

.mw-eq{display:flex;flex-direction:column;align-items:center;gap:.35rem;text-align:center;min-width:0}

  border:2px solid rgba(255,255,255,.25);box-shadow:0 4px 12px rgba(0,0,0,.35),inset 0 -4px 8px rgba(0,0,0,.25)}

.top{list-style:none;margin:0;padding:0;display:grid;gap:.7rem}

@media (prefers-reduced-motion:no-preference){
  .top-fila .pista i{animation:crece 1.2s var(--curva) var(--d,.3s) both,brilla 3s linear 1.5s infinite}

  .mw-card:nth-child(2){animation-delay:.08s}.mw-card:nth-child(3){animation-delay:.16s}

  .insignia:not(.vivo)::before{content:"";width:.45rem;height:.45rem;border-radius:50%;background:currentColor;animation:pulso 1.8s infinite}

}
@keyframes brilla{to{background-position:-200% 0}}
@media (max-width:520px){.top-fila{grid-template-columns:auto 1fr auto}.top-avatar{display:none}}


/* =====================================================================
   CAPA PREMIUM — profundidad, jerarquía y movimiento
   (va después de los estilos base para sobrescribirlos con orden)
   Verde neón = solo acciones y estados. El resto: azul, violeta y dorado.
   ===================================================================== */
:root{
  --violeta:#8b7bff; --violeta-fondo:rgba(139,123,255,.14);
  --e1:0 1px 2px rgba(0,0,0,.35),0 6px 14px -4px rgba(0,0,0,.40);
  --e2:0 2px 4px rgba(0,0,0,.30),0 14px 30px -8px rgba(0,0,0,.55),0 30px 60px -24px rgba(0,0,0,.45);
  --e3:0 3px 6px rgba(0,0,0,.30),0 22px 44px -10px rgba(0,0,0,.60),0 50px 90px -30px rgba(10,20,60,.70);
  --linea:rgba(140,170,255,.07);
}
:root[data-tema="claro"]{
  --violeta:#5b3fd6; --violeta-fondo:rgba(91,63,214,.10);
  --e1:0 1px 2px rgba(15,30,60,.10),0 6px 14px -6px rgba(15,30,60,.14);
  --e2:0 2px 4px rgba(15,30,60,.08),0 16px 32px -10px rgba(15,30,60,.20),0 30px 60px -28px rgba(15,30,60,.18);
  --e3:0 3px 6px rgba(15,30,60,.10),0 24px 48px -12px rgba(15,30,60,.28),0 50px 90px -34px rgba(29,78,216,.30);
  --linea:rgba(15,30,60,.06);
}

/* Fondo dinámico: malla de líneas + auroras que se desplazan despacio */
body::before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;
  background-image:linear-gradient(var(--linea) 1px,transparent 1px),linear-gradient(90deg,var(--linea) 1px,transparent 1px);
  background-size:3.2rem 3.2rem;
  -webkit-mask-image:radial-gradient(ellipse 85% 70% at 50% 25%,#000 20%,transparent 78%);mask-image:radial-gradient(ellipse 85% 70% at 50% 25%,#000 20%,transparent 78%)}
body::after{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;opacity:.9;
  background:radial-gradient(34rem 24rem at 18% 22%,color-mix(in srgb,var(--azul) 26%,transparent),transparent 70%),
             radial-gradient(30rem 22rem at 82% 70%,color-mix(in srgb,var(--violeta) 22%,transparent),transparent 70%),
             radial-gradient(22rem 16rem at 60% 4%,color-mix(in srgb,var(--acento) 9%,transparent),transparent 70%)}
@media (prefers-reduced-motion:no-preference){
  body::after{animation:aurora 28s ease-in-out infinite alternate}
}
@keyframes aurora{from{transform:translate3d(-3%,-2%,0) scale(1)}to{transform:translate3d(4%,3%,0) scale(1.08)}}

/* Tipografía con contraste de pesos */
h2{font-size:clamp(2rem,1.3rem + 2.4vw,3.2rem);font-weight:900;letter-spacing:-.035em}
.sub-h{font-size:.82rem;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--suave)}
.card-h h3{font-size:1.22rem;font-weight:800;letter-spacing:-.02em}
h4{color:var(--suave);font-weight:700;font-size:.72rem}
.tit-ico{background:linear-gradient(135deg,var(--azul),var(--violeta));color:#fff;box-shadow:0 12px 30px -6px color-mix(in srgb,var(--azul) 60%,transparent)}
.chip-ico{background:var(--azul-fondo);color:var(--azul)}
.verde .chip-ico{background:var(--violeta-fondo);color:var(--violeta)}
.hero .chip-ico{background:rgba(255,255,255,.18);color:#fff}
:root[data-tema="oscuro"] .chip-ico{color:#8fb4ff}

/* Halo de luz que sigue al cursor (JS pone --mx / --my) */
.tarjeta:not(.hero)::after,.kpi::after,.mw-card::after,.top-fila::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;
  background:radial-gradient(16rem 12rem at var(--mx,50%) var(--my,0%),color-mix(in srgb,var(--azul) 22%,transparent),transparent 70%);
  transition:opacity .45s var(--curva);height:auto;right:0;bottom:0;left:0;top:0}
.tarjeta:hover::after,.kpi:hover::after,.mw-card:hover::after,.top-fila:hover::after{opacity:1}
.mw-card,.top-fila{position:relative}

/* Base de lift: elevación + halo en todas las tarjetas */
.tarjeta,.kpi{transition:transform .5s var(--curva),box-shadow .5s var(--curva),border-color .5s var(--curva)}
.tarjeta:hover,.kpi:hover{transform:translateY(-8px);
  border-color:color-mix(in srgb,var(--azul) 55%,var(--borde));
  box-shadow:var(--e3),0 0 0 1px color-mix(in srgb,var(--azul) 35%,transparent),0 0 46px -4px color-mix(in srgb,var(--azul) 38%,transparent)}

/* ---- KPIs: números enormes, cada uno con su color ---- */
.kpis{gap:1.2rem;margin-bottom:1.8rem}
.kpi{border-radius:20px;padding:1.25rem 1.4rem;box-shadow:var(--e2);border-width:1px;
  background:linear-gradient(150deg,color-mix(in srgb,var(--k,var(--azul)) 14%,var(--panel-sol)),var(--panel) 70%)}
.kpi:nth-child(1){--k:var(--azul)}.kpi:nth-child(2){--k:var(--acento)}.kpi:nth-child(3){--k:var(--violeta)}
.kpi .chip-ico{width:3.4rem;height:3.4rem;border-radius:18px;background:color-mix(in srgb,var(--k) 18%,transparent);color:var(--k);
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--k) 35%,transparent)}
.kpi strong{font-size:clamp(2.8rem,2rem + 2vw,3.9rem);font-weight:900;letter-spacing:-.05em;line-height:.95;
  background:linear-gradient(180deg,var(--texto) 30%,color-mix(in srgb,var(--k) 75%,var(--texto)));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.kpi>div>span{font-size:.72rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--suave);margin-top:.3rem;display:block}

/* ---- Cada tarjeta con su propio carácter ---- */
.panel-grid{gap:1.6rem;align-items:start}
.tarjeta{border-radius:24px;box-shadow:var(--e2)}

/* Próximos partidos: escenario principal, el más profundo */
.g-prox{padding:1.8rem;border-radius:30px;box-shadow:var(--e3);border-width:1px;
  background:linear-gradient(180deg,color-mix(in srgb,var(--azul) 10%,var(--panel-sol)),color-mix(in srgb,var(--panel-sol) 88%,#000) 100%);
  border-color:color-mix(in srgb,var(--azul) 30%,var(--borde))}
.g-prox::before{left:0;right:0;height:4px;border-radius:30px 30px 0 0;opacity:1;
  background:linear-gradient(90deg,var(--azul),var(--violeta),var(--acento))}
.g-prox .card-h h3{font-size:1.5rem;font-weight:900}
.mw-card{background:color-mix(in srgb,var(--panel-sol) 70%,transparent);border-radius:18px;box-shadow:var(--e1);
  border:1px solid color-mix(in srgb,var(--azul) 18%,var(--borde))}
.mw-card:hover{transform:translateY(-6px) scale(1.015);box-shadow:var(--e2),0 0 30px -4px color-mix(in srgb,var(--azul) 40%,transparent);
  border-color:color-mix(in srgb,var(--azul) 55%,var(--borde))}
.mw-fecha{background:linear-gradient(165deg,var(--azul),var(--violeta));color:#fff;border-radius:16px;
  box-shadow:0 10px 22px -6px color-mix(in srgb,var(--violeta) 60%,transparent)}
.mw-fecha b{font-size:2rem;font-weight:900;letter-spacing:-.04em}
.mw-eq strong{font-weight:700}
.mw-x{font-weight:900;color:var(--acento-txt)}

/* Goleadores: panel sólido con borde dorado grueso a la izquierda */
.g-stats{border-radius:22px;border-left:6px solid var(--acento);box-shadow:var(--e2);
  background:linear-gradient(180deg,color-mix(in srgb,var(--panel-sol) 94%,#000),var(--panel-sol))}
.g-stats .card-h .chip-ico{background:var(--acento-fondo);color:var(--acento-txt)}
.top-fila{border-radius:14px;box-shadow:var(--e1);background:color-mix(in srgb,var(--panel-sol) 60%,transparent)}
.top-fila .pista i{background:linear-gradient(90deg,var(--azul),var(--violeta),var(--azul));background-size:200% 100%;
  box-shadow:0 0 16px color-mix(in srgb,var(--azul) 55%,transparent)}
.top-fila.p1 .pista i{background:linear-gradient(90deg,#ffb300,#ffe38a,#ffb300);background-size:200% 100%;box-shadow:0 0 18px rgba(255,200,74,.55)}
.top-gol b{font-size:1.75rem;font-weight:900;letter-spacing:-.04em}
.top-avatar{color:var(--azul);background:var(--azul-fondo);border-color:color-mix(in srgb,var(--azul) 35%,transparent)}
.top-fila:hover{border-color:color-mix(in srgb,var(--acento) 50%,var(--borde));box-shadow:var(--e2),0 0 24px -4px rgba(255,200,74,.30)}
.top-fila::after{background:radial-gradient(14rem 8rem at var(--mx,50%) var(--my,50%),rgba(255,200,74,.12),transparent 70%)}

/* Jugador de la semana: la más alta, azul profundo con luz violeta */
.g-semana{min-height:25rem;border-radius:32px;border:1px solid rgba(255,255,255,.22);box-shadow:var(--e3);
  background:radial-gradient(24rem 16rem at 100% 0%,rgba(139,123,255,.55),transparent 62%),
             radial-gradient(16rem 12rem at 0% 100%,rgba(76,141,255,.35),transparent 70%),linear-gradient(150deg,var(--hero-a),var(--hero-b) 85%)}
.g-semana .grande{font-size:2.1rem;font-weight:900;letter-spacing:-.04em;line-height:1.05;margin:.6rem 0 .2rem}
.g-semana .datos b,.g-semana .datos strong{font-size:2.2rem;font-weight:900}
.g-semana:hover{box-shadow:var(--e3),0 0 60px -6px rgba(139,123,255,.55);border-color:rgba(255,255,255,.4)}

/* Tabla: la más sobria y plana (datos densos), borde fino */
.g-liga{border-radius:16px;box-shadow:var(--e1);background:color-mix(in srgb,var(--panel-sol) 55%,transparent);border-color:var(--borde)}
.g-liga:hover{transform:translateY(-4px);box-shadow:var(--e2),0 0 34px -6px color-mix(in srgb,var(--azul) 35%,transparent)}

/* Rendimiento: borde azul de 2px y fondo teñido */
.g-rend{border-radius:28px;border:2px solid color-mix(in srgb,var(--azul) 40%,var(--borde));box-shadow:var(--e2);
  background:linear-gradient(165deg,color-mix(in srgb,var(--azul) 14%,var(--panel-sol)),var(--panel) 65%)}

/* Alertas: borde superior grueso de colores, esquinas distintas */
.g-alertas{border-radius:14px 28px 14px 28px;border-top:5px solid var(--acento);box-shadow:var(--e2)}

/* Verificación: pequeña y compacta, verde solo porque es un estado OK */
.g-verif{border-radius:20px;padding:1.2rem 1.4rem;box-shadow:var(--e1);
  background:linear-gradient(160deg,color-mix(in srgb,var(--ok) 10%,var(--panel-sol)),var(--panel) 80%);
  border-color:color-mix(in srgb,var(--ok) 30%,var(--borde))}

/* Verde neón solo en llamadas a la acción / estados: tono del menú más contenido */
.menu button[aria-current="page"]{box-shadow:0 0 22px -4px rgba(53,240,160,.22)}
.menu{box-shadow:var(--e2)}
.topbar{box-shadow:0 10px 30px -12px rgba(0,0,0,.55)}
.filtro{box-shadow:var(--e2);border-radius:20px}
.filtro{color:var(--azul)}

/* ---- Aparición escalonada (fade-in + subida + desenfoque) ---- */
@keyframes sube{from{opacity:0;transform:translateY(34px) scale(.965);filter:blur(8px)}60%{filter:blur(0)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes entra{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:no-preference){
  .topbar{animation:entra .7s var(--curva) both}
  .menu{animation:entra .8s var(--curva) .1s both}

/* ---- Gráficos (SVG/HTML propios, sin librerías) ---- */

/* ==== Los 20 clubes de la Primera A (Liga BetPlay 2026-II) ====
   Para cambiar la ciudad, la abreviatura o los colores de un club, edita esta tabla.

const CLUBES = [

const clubDe = t => { const n = ' ' + sinTilde(t && t.nombre) + ' '; return CLUBES.find(c => c.alias.some(a => n.includes(' ' + a + ' '))) || null; };
/* Deja SIEMPRE los 20 clubes en la lista: pone ciudad y abreviatura, y agrega los que la API no trajo. */
function asegurarClubes() {
  EQUIPOS.forEach(e => { const c = clubDe(e); if (c) { e.ciudad = e.ciudad || c.ciudad; if (!e.abrev || e.abrev.length > 3) e.abrev = c.abrev; } });

  EQUIPOS.sort((a, b) => String(a.nombre).localeCompare(String(b.nombre)));
}
const hueDe = hex => { const n = parseInt(hex.slice(1), 16), r = (n >> 16) / 255, g = (n >> 8 & 255) / 255, b = (n & 255) / 255, mx = Math.max(r,g,b), mn = Math.min(r,g,b), d = mx - mn;
  if (d < .25) return null; const h = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4; return Math.round((h * 60 + 360) % 360); };
const iniciales = t => { const c = clubDe(t); if (c) return c.abrev; const a = (t.abrev || '').trim(); if (a) return a.slice(0,3).toUpperCase();

const fondoClub = (c, id) => { if (!c) { const h = (Number(String(id).replace(/\D/g,'')) * 47 + 5) % 360; return `radial-gradient(circle at 30% 25%,hsl(${h} 80% 62%),hsl(${h} 70% 32%))`; }
  if (c.dib === 'franjas') return `linear-gradient(90deg,${c.c1} 0 20%,${c.c2} 20% 40%,${c.c1} 40% 60%,${c.c2} 60% 80%,${c.c1} 80% 100%)`;

  return `<span class="escudo" style="background:${fondoClub(c, id)}" aria-hidden="true"><b>${esc(iniciales(t))}</b>${urlOk(t.logo) ? `<img class="logo" src="${esc(t.logo)}" alt="" loading="lazy" referrerpolicy="no-referrer">` : ''}</span>`; };
const colorEq = id => { const c = clubDe(eq(id)); if (c) return c.c1; const k = eq(id).color; return /^[0-9a-f]{6}$/i.test(k || '') ? '#' + k : `hsl(${(Number(String(id).replace(/\D/g,'')) * 47) % 360} 70% 46%)`; };
const partesFecha = f => { const d = new Date(f + 'T00:00:00'); if (isNaN(d)) return {dia:'—', mes:'', sem:''};

  return (Number(String(id).replace(/\D/g,'')) * 47 + String(eq(id).nombre).length * 23) % 360; };

  return `<svg class="camiseta" viewBox="0 0 64 64" aria-hidden="true"><path d="M20 6 8 14l6 12 6-4v34h24V22l6 4 6-12-12-8c-2 5-7 7-12 7s-10-2-12-7z" fill="${c1}" stroke="rgba(255,255,255,.55)" stroke-width="1.5" stroke-linejoin="round"/>

const simEq = id => { const T = conPos(tabla()), r = T.find(x => x.id === id), e = eq(id), f = forma(id);

const fmtFecha = f => new Date(f + 'T00:00:00').toLocaleDateString('es-CO',{weekday:'long',day:'numeric',month:'long'});

function tabla() {
  const t = Object.fromEntries(EQUIPOS.map(e => [e.id,{id:e.id,nombre:e.nombre,pj:0,g:0,e:0,p:0,gf:0,gc:0,pts:0}]));
  PARTIDOS.filter(jugado).forEach(p => {
    [[p.local,p.gl,p.gv],[p.visita,p.gv,p.gl]].forEach(([id,f,c]) => {
      const r = t[id]; r.pj++; r.gf += f; r.gc += c;
      if (f > c) { r.g++; r.pts += 3; } else if (f === c) { r.e++; r.pts += 1; } else r.p++;
    });
  });
  return Object.values(t).map(r => ({...r, dg:r.gf-r.gc}))
    .sort((a,b) => b.pts-a.pts || b.dg-a.dg || b.gf-a.gf || a.nombre.localeCompare(b.nombre));
}

function statsJugadores(filtro) {
  return JUGADORES.filter(j => !filtro || j.equipo === filtro).map(j => {
    if (j.goles !== undefined) return {...j, pj:null, asist:j.asist ?? null, min:j.min ?? null};   // datos de la API: solo goles de temporada
    const s = STATS.filter(x => x.jugador === j.id);
    return {...j, pj:s.length, goles:s.reduce((a,x) => a+x.goles,0), asist:s.reduce((a,x) => a+x.asist,0), min:s.reduce((a,x) => a+x.min,0)};
  });
}

function jugadorSemana() {
  if (!STATS.length) {   // sin estadísticas por partido (API): se muestra el goleador del torneo
    const top = [...JUGADORES].filter(j => j.goles > 0).sort((a,b) => b.goles-a.goles || a.nombre.localeCompare(b.nombre))[0];
    return top ? {jugador:top, goles:top.goles, asist:null, min:null, torneo:true} : null;
  }
  const ult = Math.max(...PARTIDOS.filter(jugado).map(p => p.jornada));
  const ids = PARTIDOS.filter(p => p.jornada === ult && jugado(p)).map(p => p.id), pts = {};
  STATS.filter(s => ids.includes(s.partido)).forEach(s => {
    const r = pts[s.jugador] ??= {goles:0,asist:0,min:0}; r.goles += s.goles; r.asist += s.asist; r.min += s.min; });
  const top = Object.entries(pts).sort((a,b) => (b[1].goles*3+b[1].asist*2)-(a[1].goles*3+a[1].asist*2) || b[1].min-a[1].min)[0];
  return top ? {jugador:jug(+top[0]), ...top[1], jornada:ult} : null;
}

function forma(id) {
  return PARTIDOS.filter(p => jugado(p) && (p.local===id || p.visita===id)).slice(-5).map(p => {
    const [f,c] = p.local===id ? [p.gl,p.gv] : [p.gv,p.gl];
    return f>c ? 'G' : f===c ? 'E' : 'P';
  });
}

function integridad() {
  const errores = [], manual = [];
  PARTIDOS.forEach(p => {
    const ref = `Partido ${p.id} (${eq(p.local).nombre} vs ${eq(p.visita).nombre})`;
    if ((p.gl === null) !== (p.gv === null)) errores.push(`${ref}: marcador incompleto`);
    if (p.local === p.visita) errores.push(`${ref}: un equipo juega contra sí mismo`);
    if (!jugado(p)) return;
    const sts = STATS.filter(s => s.partido === p.id);
    if (STATS.length && p.gl + p.gv > 0 && !sts.length) manual.push(`${ref}: faltan estadísticas de jugadores`);
    [[p.local,p.gl],[p.visita,p.gv]].forEach(([id,g]) => {
      const suma = sts.filter(s => jug(s.jugador).equipo === id).reduce((a,s)=>a+s.goles,0);
      if (suma > g) errores.push(`${ref}: jugadores de ${eq(id).nombre} suman ${suma} goles y el equipo hizo ${g}`);
    });
    sts.forEach(s => { const e = jug(s.jugador).equipo;
      if (e !== p.local && e !== p.visita) errores.push(`${ref}: ${jug(s.jugador).nombre} no jugó este partido`); });
  });
  return {errores, manual, ok: !errores.length && !manual.length};
}

const asistEq = id => STATS.filter(s => jug(s.jugador).equipo === id).reduce((a,s) => a+s.asist, 0);

const serieEquipo = id => PARTIDOS.filter(p => jugado(p) && (p.local===id || p.visita===id)).map((p,i) => ({
  n:i+1, rival:eq(p.local===id ? p.visita : p.local).nombre, gf:p.local===id ? p.gl : p.gv,
  asist:STATS.filter(s => s.partido===p.id && jug(s.jugador).equipo===id).reduce((a,s) => a+s.asist, 0)})).slice(-8);

const ordenar = l => [...l].sort((a,b) => b.goles-a.goles || b.asist-a.asist || a.nombre.localeCompare(b.nombre));

const conPos = t => t.map((r,i) => ({...r,pos:i+1}));

function calcularAlertas() {   // alertas "inteligentes" calculadas con los resultados
  const out = [];
  EQUIPOS.forEach(e => {
    const r = PARTIDOS.filter(p => jugado(p) && (p.local === e.id || p.visita === e.id)).sort((a,b) => a.fecha.localeCompare(b.fecha))
      .map(p => { const [f,c] = p.local === e.id ? [p.gl,p.gv] : [p.gv,p.gl]; return f > c ? 'G' : f === c ? 'E' : 'P'; });
    let g = 0, s = 0;
    for (let i = r.length-1; i >= 0 && r[i] === 'G'; i--) g++;
    for (let i = r.length-1; i >= 0 && r[i] !== 'G'; i--) s++;
    if (g >= 3) out.push({tipo:'racha', equipo:e.id, texto:`Suma ${g} victorias seguidas`, n:g});
    else if (s >= 4) out.push({tipo:'bajon', equipo:e.id, texto:`Lleva ${s} partidos sin ganar`, n:s});
  });
  return out.sort((a,b) => b.n - a.n).slice(0, 6);
}

const lineas = serie => {

const radar = id => {
  const T = tabla(), me = T.find(r => r.id===id), mx = k => Math.max(1, ...T.map(r => r[k]));
  const maxA = Math.max(1, ...EQUIPOS.map(e => asistEq(e.id))), maxGc = Math.max(1, ...T.map(r => r.gc));
  const ej = [['Puntos',me.pts/mx('pts')],['Goles a favor',me.gf/mx('gf')],(STATS.length ? ['Asistencias',asistEq(id)/maxA] : ['Dif. de gol',(me.dg-Math.min(...T.map(r => r.dg)))/Math.max(1,Math.max(...T.map(r => r.dg))-Math.min(...T.map(r => r.dg)))]),
              ['Defensa',(maxGc-me.gc)/maxGc],['Victorias',me.g/mx('g')]];
  const cx=190, cy=120, R=70, ang = i => (-90+i*72)*Math.PI/180;
  const xy = (i,f) => [cx+Math.cos(ang(i))*R*f, cy+Math.sin(ang(i))*R*f];
  const P = (i,f) => xy(i,f).map(v => v.toFixed(1)).join(',');
  const anillo = f => `<polygon points="${ej.map((_,i) => P(i,f)).join(' ')}" class="g-rej"/>`;
  const etq = ej.map((e,i) => { const c = Math.cos(ang(i)), [x,y] = xy(i,(R+14)/R);
    return `<text x="${x.toFixed(1)}" y="${(y+5).toFixed(1)}" text-anchor="${Math.abs(c)<0.2?'middle':c>0?'start':'end'}">${e[0]}</text>`; }).join('');
  const desc = ej.map(e => `${e[0]} ${Math.round(e[1]*100)} %`).join(', ');
  return `<svg class="grafico radar" viewBox="0 0 380 240" role="img" aria-label="Perfil del equipo comparado con el mejor de la liga: ${desc}">
    ${anillo(1)}${anillo(.66)}${anillo(.33)}${ej.map((_,i) => `<line x1="${cx}" y1="${cy}" x2="${xy(i,1)[0].toFixed(1)}" y2="${xy(i,1)[1].toFixed(1)}" class="g-rej"/>`).join('')}
    <polygon points="${ej.map((e,i) => P(i,e[1])).join(' ')}" class="r-area"/>${etq}</svg>`;
};

const tablaPron = ps => `<div class="scroll" tabindex="0"><table class="compacta tabla-pron"><caption class="solo-lectores">Pronóstico de los próximos partidos</caption>

function fiabilidad() {
  const e = evaluarModelo();
  if (!e || e.n < 5) return `<p class="nota">${ic('info')}<span>Aún hay pocos partidos jugados para medir la precisión del modelo. Se mostrará cuando haya más datos.</span></p>`;
  const f = x => x.toFixed(0) + ' %';
  return `<p>Probamos el modelo con <strong>${e.n}</strong> partidos ya jugados. Para cada uno solo usó los partidos anteriores a esa fecha, como en un pronóstico real.</p>
    <div class="datos">${dato(f(e.acc),'Aciertos del modelo')}${dato(f(e.accGanados),'Elegir al que más ha ganado')}${dato(f(e.accLocal),'Elegir siempre al local')}</div>
    <p>Error de probabilidad (Brier, menor es mejor): modelo <strong>${e.brier.toFixed(3)}</strong> frente a <strong>${e.brierRef.toFixed(3)}</strong> de una referencia que no conoce a los equipos${e.brier < e.brierRef ? ` (mejora del ${e.mejora.toFixed(0)} %)` : ''}.</p>
    <p class="muted">${e.acc >= e.accGanados ? 'El modelo supera a la regla simple de partidos ganados.' : 'Con los datos actuales el modelo aún no supera la regla simple; mejorará con más partidos.'} El fútbol tiene mucho azar, por eso se muestran probabilidades y no certezas.</p>`;
}

function calcularPrediccion(fecha) {
  const l = +$('#p-local').value, v = +$('#p-visita').value, out = $('#p-res');
  if (l === v) { out.innerHTML = `<p>${estado(false,'Elija dos equipos distintos.')}</p>`; return; }
  const r = prediccion(l, v, typeof fecha === 'string' ? fecha : undefined);
  if (!r) { out.innerHTML = `<p>${estado(false,'Faltan datos')} Se necesitan más partidos jugados para estimar.</p>`; return; }
  const fila = (t, x) => `<div class="fila-prob"><strong>${t}: ${x.toFixed(0)} %</strong><div class="pista" aria-hidden="true"><i style="width:${x.toFixed(0)}%"></i></div></div>`;
  const cc = {Alta:'ok', Media:'aviso', Baja:'mal'}[r.confianza];
  $('#s-l').innerHTML = simEq(l); $('#s-v').innerHTML = simEq(v);
  const vs = [r.local, r.empate, r.visita], gm = vs.indexOf(Math.max(...vs));
  const cab = `<div class="res-vs"><div class="${gm===0?'gana':''}">${escudo(l)}<b>${r.local.toFixed(0)} %</b><span>${esc(eq(l).nombre)}</span></div><div class="res-e ${gm===1?'gana':''}"><b>${r.empate.toFixed(0)} %</b><span>Empate</span></div><div class="${gm===2?'gana':''}">${escudo(v)}<b>${r.visita.toFixed(0)} %</b><span>${esc(eq(v).nombre)}</span></div></div>`;
  out.innerHTML = cab + fila('Gana '+esc(eq(l).nombre), r.local) + fila('Empate', r.empate) + fila('Gana '+esc(eq(v).nombre), r.visita) +
    `<div class="forma"><span class="etq ${cc}">${ic(r.confianza==='Alta'?'check':'info')}Confianza ${r.confianza}</span>
     <span class="etq">Goles esperados ${r.lamL.toFixed(1)} - ${r.lamV.toFixed(1)}</span><span class="etq">Más de 2,5 goles: ${r.over25.toFixed(0)} %</span>
     <span class="etq">Ambos anotan: ${r.btts.toFixed(0)} %</span></div>
     <h4>Marcadores más probables</h4><div class="forma">${r.marcadores.map(m => `<span class="etq info">${m.m} · ${m.p.toFixed(0)} %</span>`).join('')}</div>
     <h4>Por qué sale este resultado</h4><ul class="lista">${r.factores.map(x => `<li>${esc(x)}</li>`).join('')}</ul>`;
}

/* ================= OBJETIVO 3: dashboard interactivo (filtros, indicadores y pruebas) ================= */
const FECHAS = {desde: '', hasta: ''};
const PRUEBAS = {carga: null, render: []};
const ymdLocal = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const fechaRefDatos = () => { const f = PARTIDOS.filter(jugado).map(p => p.fecha).sort(); return f.length ? new Date(f[f.length-1] + 'T00:00:00') : new Date(); };
const rangoActivo = r => !!(r && (r.desde || r.hasta));
const filtrarFechas = (arr, r = FECHAS) => arr.filter(p => (!r.desde || p.fecha >= r.desde) && (!r.hasta || p.fecha <= r.hasta));
/* Dibuja una pantalla; si hay rango de fechas, las tablas y cifras usan solo los partidos de ese rango. */
function generar(v, f, rango = FECHAS) {
  const todos = PARTIDOS, filtra = v !== 'predicciones' && rangoActivo(rango);
  if (filtra) { PARTIDOS_TODOS = todos; PARTIDOS = filtrarFechas(todos, rango); }
  try { return VISTAS[v](f); } finally { PARTIDOS = todos; PARTIDOS_TODOS = null; }
}
function rangoRapido(k) {
  const ref = fechaRefDatos();
  if (k === '30') return {desde: ymdLocal(new Date(ref.getTime() - 30*864e5)), hasta: ''};
  if (k === 'mes') return {desde: ymdLocal(new Date(ref.getFullYear(), ref.getMonth(), 1)), hasta: ''};
  return {desde: '', hasta: ''};
}
function pintarFiltroFechas() {
  const d = $('#f-desde'), h = $('#f-hasta'); if (!d) return;
  d.value = FECHAS.desde; h.value = FECHAS.hasta;
  const act = !rangoActivo(FECHAS) ? 'todo' : ['30','mes'].find(k => { const r = rangoRapido(k); return r.desde === FECHAS.desde && r.hasta === FECHAS.hasta; }) || '';
  document.querySelectorAll('#f-rapido button').forEach(b => b.classList.toggle('on', b.dataset.rango === act));
  const i = $('#f-info');
  i.textContent = rangoActivo(FECHAS) && vista !== 'predicciones' ? `Mostrando ${filtrarFechas(PARTIDOS).length} de ${PARTIDOS.length} partidos` : '';
}
function iniciarFiltroFechas() {
  try { Object.assign(FECHAS, JSON.parse(localStorage.getItem('df-fechas-v1')) || {}); } catch {}
  const cambiar = r => { FECHAS.desde = r.desde || ''; FECHAS.hasta = r.hasta || '';
    if (FECHAS.desde && FECHAS.hasta && FECHAS.desde > FECHAS.hasta) [FECHAS.desde, FECHAS.hasta] = [FECHAS.hasta, FECHAS.desde];
    try { localStorage.setItem('df-fechas-v1', JSON.stringify(FECHAS)); } catch {}
    mostrar(); };
  $('#f-desde').addEventListener('change', () => cambiar({desde: $('#f-desde').value, hasta: FECHAS.hasta}));
  $('#f-hasta').addEventListener('change', () => cambiar({desde: FECHAS.desde, hasta: $('#f-hasta').value}));
  document.querySelectorAll('#f-rapido button').forEach(b => b.addEventListener('click', () => cambiar(rangoRapido(b.dataset.rango))));
}

/* ---- Indicadores clave de la liga ---- */
const rachaGanadora = id => { const l = PARTIDOS.filter(p => jugado(p) && (p.local === id || p.visita === id)).sort((a, b) => a.fecha.localeCompare(b.fecha) || a.id - b.id); let n = 0;
  for (let i = l.length - 1; i >= 0; i--) { const [f, c] = l[i].local === id ? [l[i].gl, l[i].gv] : [l[i].gv, l[i].gl]; if (f > c) n++; else break; } return n; };
function indicadores() {
  const ps = PARTIDOS.filter(jugado); if (!ps.length) return null;
  const n = ps.length, loc = ps.filter(p => p.gl > p.gv).length, emp = ps.filter(p => p.gl === p.gv).length;
  const T = tabla().filter(r => r.pj > 0);
  const gole = [...ps].sort((a, b) => Math.abs(b.gl - b.gv) - Math.abs(a.gl - a.gv) || (b.gl + b.gv) - (a.gl + a.gv))[0];
  const racha = EQUIPOS.map(e => ({id: e.id, n: rachaGanadora(e.id)})).sort((a, b) => b.n - a.n)[0];
  return {n, loc, emp, vis: n - loc - emp, o25: ps.filter(p => p.gl + p.gv > 2.5).length, btts: ps.filter(p => p.gl > 0 && p.gv > 0).length, ceros: ps.filter(p => p.gl + p.gv === 0).length,
    gole, ataque: [...T].sort((a, b) => b.gf - a.gf)[0], defensa: [...T].sort((a, b) => a.gc - b.gc || b.pj - a.pj)[0], racha};
}
const pct = (a, n) => n ? Math.round(a / n * 100) : 0;
const tileInd = (icono, valor, etq, sub) => `<div class="ind"><span class="chip-ico">${ic(icono)}</span><div><b>${valor}</b><span>${etq}</span>${sub ? `<em>${sub}</em>` : ''}</div></div>`;
function indicadoresHTML() {
  const x = indicadores(); if (!x) return '<p>No hay partidos jugados en este rango de fechas.</p>';
  const g = x.gole;
  return `<div class="ind-barra" role="img" aria-label="Gana local ${pct(x.loc,x.n)} %, empate ${pct(x.emp,x.n)} %, gana visitante ${pct(x.vis,x.n)} %"><i class="b0" style="flex:${Math.max(x.loc,.05)}"></i><i class="b1" style="flex:${Math.max(x.emp,.05)}"></i><i class="b2" style="flex:${Math.max(x.vis,.05)}"></i></div>
  <div class="ind-ley"><span><i class="p0"></i>Gana local <b>${pct(x.loc,x.n)} %</b></span><span><i class="p1"></i>Empate <b>${pct(x.emp,x.n)} %</b></span><span><i class="p2"></i>Gana visitante <b>${pct(x.vis,x.n)} %</b></span></div>
  <div class="ind-grid">
    ${tileInd('trending', pct(x.o25,x.n) + ' %', 'Partidos con más de 2,5 goles')}
    ${tileInd('ball', pct(x.btts,x.n) + ' %', 'Ambos equipos anotan')}
    ${tileInd('event', x.ceros, 'Partidos sin goles (0-0)')}
    ${tileInd('star', `${g.gl} - ${g.gv}`, 'Mayor goleada', `${esc(eq(g.local).nombre)} vs ${esc(eq(g.visita).nombre)}`)}
    ${x.ataque ? tileInd('bar', x.ataque.gf, 'Mejor ataque (goles)', esc(x.ataque.nombre)) : ''}
    ${x.defensa ? tileInd('shield', x.defensa.gc, 'Mejor defensa (en contra)', esc(x.defensa.nombre)) : ''}
    ${x.racha && x.racha.n >= 2 ? tileInd('trophy', x.racha.n, 'Mejor racha de victorias', esc(eq(x.racha.id).nombre)) : tileInd('trophy', '—', 'Mejor racha de victorias', 'Aún no hay rachas')}
  </div>
  <p class="muted nota-ind">Las tarjetas y las cuotas no se muestran porque la API gratuita no las entrega.</p>`;
}

/* ---- Pruebas de velocidad y funcionamiento ---- */
const prom = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : 0;
const msTxt = v => v >= 1000 ? (v / 1000).toFixed(1) + ' s' : Math.round(v) + ' ms';
function pruebasHTML() {
  const pr = prom(PRUEBAS.render), okC = PRUEBAS.carga !== null && PRUEBAS.carga < 3000, okF = PRUEBAS.render.length && pr < 200;

async function autoprueba() {
  const out = $('#prueba-res'), btn = $('#p-auto'); btn.disabled = true;
  const ref = fechaRefDatos(), rangos = [{desde:'',hasta:''}, rangoRapido('30'), rangoRapido('mes'), {desde: ymdLocal(new Date(ref.getTime() + 864e5)), hasta: ''}];
  const casos = [0, ...EQUIPOS.map(e => e.id)], vistas = Object.keys(VISTAS), tiempos = [], fallas = [], total = casos.length * vistas.length * rangos.length;
  let hechos = 0, peor = {ms: 0, d: ''};
  for (const r of rangos) for (const f of casos) for (const v of vistas) {
    const t0 = performance.now();
    try { const h = generar(v, v === 'predicciones' ? 0 : f, r); const d = document.createElement('div'); d.innerHTML = h;
      if (/undefined|NaN|Infinity/.test(h)) fallas.push(`${v} (${f ? eq(f).nombre : 'todos'})`); }
    catch (e) { fallas.push(`${v}: ${e.message}`); }
    const ms = performance.now() - t0; tiempos.push(ms); if (ms > peor.ms) peor = {ms, d: `${v}, ${f ? eq(f).nombre : 'todos los equipos'}`};
    if (++hechos % 12 === 0) { out.textContent = `Probando… ${Math.round(hechos / total * 100)} %`; await new Promise(res => setTimeout(res)); }
  }
  const ok = !fallas.length && prom(tiempos) < 200;
  out.innerHTML = `<p>${estado(ok, ok ? 'Aprobada' : 'Revisar')} ${total} combinaciones (5 pantallas × ${casos.length} opciones de equipo × 4 rangos de fechas).</p>
    <div class="datos">${dato(fallas.length, 'Errores')}${dato(msTxt(prom(tiempos)), 'Promedio')}${dato(msTxt(peor.ms), 'Más lenta')}</div>
    <p class="muted">La más lenta fue: ${esc(peor.d)}.${fallas.length ? ' Fallas: ' + esc([...new Set(fallas)].slice(0, 4).join('; ')) : ''}</p>`;
  btn.disabled = false;
}

async function diagnosticar() {
  const box = $('#diag-box'), out = $('#diag-res'); box.hidden = false; out.textContent = 'Probando la conexión con ESPN…'; $('#diag').disabled = true;
  const L = [], hoy = new Date(), pad = n => String(n).padStart(2, '0'), ym = `${hoy.getFullYear()}${pad(hoy.getMonth() + 1)}`, ymd = ym + pad(hoy.getDate());
  L.push(`Fecha de hoy: ${ymdLocal(hoy)} · La página se abrió como: ${location.protocol} · Navegador en línea: ${navigator.onLine ? 'sí' : 'no'}`);
  const paso = async (nombre, fn) => { const t0 = performance.now();
    try { const r = await fn(); L.push(`OK    ${nombre}: ${r} (${Math.round(performance.now() - t0)} ms)`); }
    catch (e) { L.push(`FALLA ${nombre}: ${(e && e.message) || e}`); } };
  for (const base of API.bases) { const host = new URL(base).host;
    await paso(`${host} · partidos del mes ${ym}`, async () => { const ev = (await API.pedir(base, ym)).events || [], f = ev.map(e => String(e.date).slice(0, 10)).sort();
      return `${ev.length} partidos${ev.length ? ` (del ${f[0]} al ${f[f.length - 1]})` : ''}`; });
    await paso(`${host} · partidos de hoy ${ymd}`, async () => `${((await API.pedir(base, ymd)).events || []).length} partidos`);
    await paso(`${host} · lista de clubes`, async () => { const j = await API.pedirURL(`${base}${API.liga}/teams`); const l = ((((j.sports || [])[0] || {}).leagues || [])[0] || {}).teams || []; return `${l.length} clubes`; }); }
  await paso('Procesar los datos de ESPN en esta página', async () => { let d = null, e0 = null;
    for (const base of API.bases) { try { d = API.normalizar(await API.traerEventos(base, API.diasAtras)); break; } catch (e) { e0 = e; } }
    if (!d) throw e0 || new Error('sin datos'); const jug = d.PARTIDOS.filter(p => p.gl !== null), ult = jug.map(p => p.fecha).sort().pop();
    return `${d.EQUIPOS.length} equipos, ${jug.length} partidos jugados, último partido: ${ult}`; });
  L.push(`Datos que se están mostrando ahora: ${FUENTE.tipo} · ${EQUIPOS.length} equipos · ${PARTIDOS.length} partidos`);
  if (L.some(l => /Failed to fetch|NetworkError|sin conexión/i.test(l))) L.push('Pista: "Failed to fetch" suele ser internet caído, un antivirus, un bloqueador de anuncios o una red (colegio) que no deja entrar a ESPN. Prueba desde otra red o con los datos de tu base (botón "Cargar datos.json").');
  out.textContent = L.join('\n'); $('#diag').disabled = false;
}
async function cargarArchivo(file) {
  try {
    const d = JSON.parse(await file.text());
    if (!Array.isArray(d.EQUIPOS) || !Array.isArray(d.PARTIDOS) || !d.PARTIDOS.some(p => p.gl !== null)) throw new Error('el archivo no tiene equipos y partidos jugados');
    const fuente = {tipo: 'copia', texto: 'Datos cargados desde tu archivo', t: d.actualizado || file.lastModified || Date.now()};
    API.guardarCache(d, fuente);
    const manuales = d.ALERTAS || []; d.ALERTAS = []; d.JUGADORES = d.JUGADORES || []; d.STATS = d.STATS || [];
    usarDatos({...d, fuente}); ALERTAS = alertasFinales(manuales); MARCADOR.registrar(); llenarFiltro(); mostrar(); pintarEstado();
  } catch (err) { FUENTE = {...FUENTE, detalle: 'No se pudo leer el archivo: ' + err.message, error: true}; pintarEstado(); }
}
