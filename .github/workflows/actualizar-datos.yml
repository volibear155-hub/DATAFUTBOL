name: Actualizar datos
on:
  schedule:
    - cron: '0 */3 * * *'   # cada 3 horas
  workflow_dispatch:         # y cuando tú pulses "Run workflow"
permissions:
  contents: write
jobs:
  datos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node actualizar_datos.mjs
      - run: |
          git config user.name "datos-bot"
          git config user.email "datos-bot@users.noreply.github.com"
          git add datos.json
          git diff --cached --quiet || git commit -m "Actualizar datos"
          git push
